[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-detection"
version = "0.1.0"
description = "Simple OpenCV-based face detection and recognition for images and webcams."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-contrib-python>=4.10,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
face-detect = "face_detection.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
